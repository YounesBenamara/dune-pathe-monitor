name: Surveiller Dune 3 — Pathé Odysseum

on:
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Forcer l'envoi de l'alerte même si déjà connue"
        type: boolean
        default: false
      movie_title:
        description: "Titre du film à tester (ex: Bound, par défaut Dune 3)"
        type: string
        default: ""
      test_date:
        description: "Date cible à tester (format YYYY-MM-DD, ex: 2026-09-18)"
        type: string
        default: ""
      days:
        description: "Nombre de jours à vérifier (ex: 1)"
        type: string
        default: ""
  repository_dispatch:
    types: [monitor_check]

concurrency:
  group: dune-pathe-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Installer les dépendances
        run: |
          python -m pip install -r requirements.txt
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install --with-deps chromium
          fi

      # Le cache persiste les séances déjà vues entre deux serveurs temporaires.
      - name: Restaurer l'état précédent
        uses: actions/cache/restore@v4
        with:
          path: state
          key: dune-pathe-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dune-pathe-state-v2-

      - name: Vérifier Pathé et alerter (Telegram / ntfy)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          DATA_DIR="state"
          if [ -n "${{ inputs.movie_title }}" ]; then
            DATA_DIR="test_state"
          fi
          mkdir -p "$DATA_DIR"
          CMD=(python dune_pathe_monitor.py --data-dir "$DATA_DIR")
          if [ "${{ inputs.force_notify }}" = "true" ]; then
            CMD+=(--force-notify)
          fi
          if [ -n "${{ inputs.movie_title }}" ]; then
            CMD+=(--movie-title "${{ inputs.movie_title }}")
          fi
          if [ -n "${{ inputs.test_date }}" ]; then
            CMD+=(--start-date "${{ inputs.test_date }}")
          fi
          if [ -n "${{ inputs.days }}" ]; then
            CMD+=(--days "${{ inputs.days }}")
          fi
          "${CMD[@]}"

      - name: Sauvegarder le nouvel état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: dune-pathe-state-v2-${{ github.run_id }}-${{ github.run_attempt }}

