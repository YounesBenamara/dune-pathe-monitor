name: Surveiller Dune 3 — Pathé Odysseum

on:
  schedule:
    # Une fois par jour à 07:15 UTC (09:15 heure de Paris en été, 08:15 en hiver).
    # Préserve le quota gratuit de 2 000 min/mois de GitHub Actions (~30 min/mois consommées).
    - cron: "15 7 * * *"
  workflow_dispatch:

concurrency:
  group: dune-pathe-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le navigateur
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Le cache persiste les séances déjà vues entre deux serveurs temporaires.
      - name: Restaurer l'état précédent
        uses: actions/cache/restore@v4
        with:
          path: state
          key: dune-pathe-state-${{ github.run_id }}
          restore-keys: dune-pathe-state-

      - name: Vérifier Pathé et alerter (Telegram / ntfy)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          mkdir -p state
          python dune_pathe_monitor.py --data-dir state

      - name: Sauvegarder le nouvel état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: dune-pathe-state-${{ github.run_id }}

