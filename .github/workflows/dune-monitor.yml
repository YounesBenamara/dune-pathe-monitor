name: Surveiller Dune 3 — Pathé Odysseum

on:
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Forcer l'envoi de l'alerte même si déjà connue"
        type: boolean
        default: false
  repository_dispatch:
    types: [monitor_check]

concurrency:
  group: dune-pathe-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Installer les dépendances
        run: |
          python -m pip install -r requirements.txt
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install --with-deps chromium
          fi

      # Le cache persiste les séances déjà vues entre deux serveurs temporaires.
      - name: Restaurer l'état précédent
        uses: actions/cache/restore@v4
        with:
          path: state
          key: dune-pathe-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dune-pathe-state-v2-

      - name: Vérifier Pathé et alerter (Telegram / ntfy)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          mkdir -p state
          python dune_pathe_monitor.py --data-dir state ${{ inputs.force_notify && '--force-notify' || '' }}

      - name: Sauvegarder le nouvel état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: dune-pathe-state-v2-${{ github.run_id }}-${{ github.run_attempt }}

