name: Surveiller Dune 3 — Pathé Odysseum (AlloCiné)

on:
  schedule:
    # Surveillance automatique régulière (toutes les 15 minutes)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Forcer l'envoi de l'alerte de test (Telegram / ntfy)"
        type: boolean
        default: false
      target_date:
        description: "Date cible (format YYYY-MM-DD, ex: 2026-12-16)"
        type: string
        default: "2026-12-16"
  repository_dispatch:
    types: [monitor_check]

concurrency:
  group: dune-pathe-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install -r requirements.txt

      # Le cache persiste les séances déjà vues entre deux serveurs temporaires.
      - name: Restaurer l'état précédent
        uses: actions/cache/restore@v4
        with:
          path: state
          key: dune-pathe-state-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dune-pathe-state-v3-

      - name: Vérifier AlloCiné et alerter (Telegram / ntfy)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          mkdir -p state
          TARGET_DATE="${{ inputs.target_date || '2026-12-16' }}"
          CMD=(python dune_pathe_monitor.py --data-dir state --date "$TARGET_DATE")
          if [ "${{ inputs.force_notify }}" = "true" ]; then
            CMD+=(--force-notify)
          fi
          "${CMD[@]}"

      - name: Sauvegarder le nouvel état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: dune-pathe-state-v3-${{ github.run_id }}-${{ github.run_attempt }}
